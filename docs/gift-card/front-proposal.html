<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steampunk Shuffle gift card - front PROPOSAL (ATT-29)</title>
<style>
@page { size: 5.25in 7.25in; margin: 0 }
.front .bg { background-position: 50% 30%; }
.front .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,16,12,.0) 38%, rgba(20,16,12,.55) 62%, rgba(20,16,12,.9) 100%); }
.front .label { position: absolute; left: 0.3in; right: 0.3in; bottom: 0.45in; text-align: center; color: var(--parchment); }
.front .kicker { font: 600 12pt/1.2 "Lora", serif; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); margin: 0 0 .08in; }
.front .hb { font: 900 46pt/1 "Playfair Display", serif; margin: 0; text-shadow: 0 0.02in 0.06in rgba(0,0,0,.6); }
.front .hb span { display: block; }
.front .sub { font: italic 400 16pt/1.25 "Lora", serif; margin: .1in 0 0; color: var(--parchment); }
.front .frame { position: absolute; inset: 0.3in; border: 0.03in solid var(--gold); border-radius: 0.12in; box-shadow: 0 0 0 0.03in var(--ink) inset; }
</style>
<link rel="stylesheet" href="card.css">
</head>
<body>
<!-- PROPOSAL. No card front exists in the repo (see README.md). This is a simple front in the style
     bible's look, built only from art/inbox/background-the-taproom.jpeg (copy in art/ made by prep-art.py). Brent's real front, if he
     has one outside the repo, replaces it; the backs do not depend on it. -->
<main class="card front">
  <div class="bg" style="background-image:url('art/background-the-taproom.jpg')"></div>
  <div class="shade"></div>
  <div class="trim">
    <div class="frame"></div>
    <div class="label">
      <p class="kicker">The Wheatstone Bridge &middot; 1871</p>
      <p class="hb"><span>Happy</span><span>Birthday</span></p>
      <p class="sub">A card game made for you.</p>
    </div>
  </div>
  <div class="slug">PROPOSAL FRONT - NOT THE FRONT OF RECORD - THIS STRIP IS TRIMMED OFF</div>
</main><!--/card-->
</body>
</html>
